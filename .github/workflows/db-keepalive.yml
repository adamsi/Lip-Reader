
# Keep the Supabase project alive: hit the API's /api/db_ping (SELECT 1)
# every 5 minutes so the free-tier database is never paused for inactivity.
name: db-keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: SELECT 1 via /api/db_ping
        run: |
          curl -sS --max-time 30 --retry 2 https://chaplin-ai.vercel.app/api/db_ping
