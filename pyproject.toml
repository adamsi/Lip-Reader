[project]
name = "lipreader"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.5.5.62",
    "scipy>=1.3.0",
    "scikit-image>=0.13.0",
    "av>=10.0.0",
    "six>=1.16.0",
    "mediapipe==0.10.21",
    "torch",
    "torchvision",
    "torchaudio",
    "transformers==4.44.2",
    "anthropic",
    "python-dotenv",
    "inworld-tts",
    "sounddevice",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "pyjwt[crypto]",
    "httpx",
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "filelock"]
